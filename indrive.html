<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>تطبيق النقل</title>
<style>
:root{--bg:#fff6ef;--card:#ffffff;--ink:#1f1f1f;--muted:#7a6f66;--accent:#ff6a13;--accent-ink:#ffffff;--ok:#0f9d58;--bad:#e11d48;--line:#f1e4da;--shadow:0 1px 2px rgba(0,0,0,.04),0 8px 22px rgba(255,106,19,.10);--r:18px}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#140d09;--card:#1f1611;--ink:#f5ece6;--muted:#b8a89c;--line:#3a2a20;--shadow:0 8px 22px rgba(0,0,0,.35)}}
*{box-sizing:border-box}
body{margin:0;font-family:"Segoe UI",Tahoma,"Noto Sans Arabic",Arial,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh}
header{background:linear-gradient(135deg,#ff7a1a,#ff5210);color:#fff;padding:16px;position:sticky;top:0;z-index:5;box-shadow:0 4px 14px rgba(255,80,16,.35)}
.hrow{max-width:560px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{font-weight:900;font-size:1.3rem;letter-spacing:.3px}
main{max-width:560px;margin:0 auto;padding:16px 14px 70px}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:16px;margin-bottom:14px;border:1px solid var(--line);animation:rise .35s ease both}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
label{display:block;font-size:.9rem;color:var(--muted);margin:12px 0 6px}
input,.sel{width:100%;padding:13px 14px;border-radius:12px;border:1px solid var(--line);font:inherit;background:var(--card);color:var(--ink);outline:none}
input:focus,.sel:focus{border-color:var(--accent)}
.row{display:flex;align-items:center;gap:8px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.muted{color:var(--muted);font-size:.9rem}
.mapbox{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.pt{display:flex;align-items:center;gap:10px;background:#fff8f2;border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.pdot{width:12px;height:12px;border-radius:50%;flex:none;border:2px solid #fff;box-shadow:0 0 0 1px var(--line)}
.pl{flex:1;font-weight:700;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mlink{color:#fff;background:#2563eb;text-decoration:none;font-weight:700;font-size:.85rem;padding:8px 12px;border-radius:10px;white-space:nowrap}
.dist{font-weight:800;color:var(--accent);margin-top:2px;text-align:center}
.svcs{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:6px}
.svc{display:flex;flex-direction:column;align-items:center;gap:4px;border:2px solid var(--line);border-radius:16px;padding:12px 8px;cursor:pointer;background:var(--card);color:var(--ink);font:inherit}
.svc.on{border-color:var(--accent);background:#fff1e6}
.svc .ico{font-size:2rem}
.svc .t{font-weight:800}
.gbtns{display:flex;gap:10px;margin-top:6px}
.gbtn{flex:1;padding:12px;border:2px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink);cursor:pointer;font:inherit;font-weight:700}
.gbtn.on{border-color:var(--accent);background:#fff1e6}
.tabs2{display:flex;gap:8px;margin:14px 0 4px}
.tab2{flex:1;padding:10px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-weight:700;cursor:pointer}
.tab2.on{border-color:var(--accent);background:#fff1e6}
.or{display:flex;align-items:center;gap:10px;color:var(--muted);margin:14px 0 4px;font-size:.9rem}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
.step{width:52px;height:52px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:1.4rem;font-weight:700;cursor:pointer}
.stepper{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:6px}
.amount{font-size:2rem;font-weight:900;color:var(--accent)}
.amount small{font-size:.9rem;color:var(--muted);font-weight:600}
.btn{width:100%;padding:15px;border:none;border-radius:14px;background:var(--accent);color:var(--accent-ink);font:inherit;font-weight:800;font-size:1.05rem;cursor:pointer;margin-top:14px;display:block;text-align:center;text-decoration:none;box-shadow:0 6px 16px rgba(255,106,19,.3)}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink);box-shadow:none}
.btn.danger{background:var(--bad);color:#fff;box-shadow:none}
.btn:disabled{opacity:.5;cursor:default}
.btn:active{transform:scale(.98)}
.link{color:var(--muted);background:none;border:none;font:inherit;cursor:pointer;padding:6px;text-decoration:underline}
.status{display:inline-block;padding:6px 12px;border-radius:999px;font-size:.85rem;font-weight:700;background:#fff3c4;color:#7a5600}
.status.accepted,.status.done{background:#d7f5e5;color:#0a6b3c}
.status.cancelled{background:#fde2e7;color:#9f1239}
.route{display:flex;flex-direction:column;gap:6px}
.route div{display:flex;align-items:center;gap:10px;font-weight:600}
.dot{width:10px;height:10px;border-radius:50%;background:var(--ok);flex:none}
.dot.end{background:var(--bad)}
.offer{display:flex;align-items:center;justify-content:space-between;gap:12px;border:1px solid var(--line);border-radius:14px;padding:14px;margin-top:10px}
.offer .name{font-weight:800}
.offer .meta{color:var(--muted);font-size:.85rem;margin-top:3px}
.oprice{font-weight:900;font-size:1.2rem;margin-top:4px;color:var(--accent)}
.acc,.send{padding:10px 16px;min-height:44px;border:none;border-radius:12px;background:var(--ok);color:#fff;font:inherit;font-weight:700;cursor:pointer;white-space:nowrap}
.empty{color:var(--muted);text-align:center;padding:22px 8px}
.pulse{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--accent);margin-left:6px;animation:p 1.2s infinite}
@keyframes p{0%{opacity:1}50%{opacity:.2}100%{opacity:1}}
.err{color:var(--bad);font-size:.9rem;margin-top:10px;min-height:18px}
.eta{display:inline-block;background:#fff1e6;color:#c2410c;padding:4px 10px;border-radius:999px;font-size:.85rem;font-weight:700;margin-top:8px}
.chat{max-height:260px;overflow:auto;display:flex;flex-direction:column;gap:8px;padding:8px 2px;margin-top:8px}
.bubble{max-width:78%;padding:9px 13px;border-radius:16px;font-size:.95rem;word-wrap:break-word}
.bubble.me{align-self:flex-start;background:var(--accent);color:#fff;border-bottom-right-radius:4px}
.bubble.them{align-self:flex-end;background:#f1f5f9;color:#111;border-bottom-left-radius:4px}
.chatbar{display:flex;gap:8px;margin-top:10px}
.chatbar input{flex:1}
.reqitem{display:flex;flex-direction:column;gap:10px;border:1px solid var(--line);border-radius:14px;padding:12px;margin-top:10px}
.reqtop{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.badge{background:#e0f2fe;color:#0369a1;font-weight:800;font-size:.85rem;padding:4px 10px;border-radius:999px;white-space:nowrap}
.badge.near{background:#d7f5e5;color:#0a6b3c}
#toast{position:fixed;bottom:20px;left:50%;transform:translate(-50%,140px);background:#1f1f1f;color:#fff;padding:12px 18px;border-radius:14px;box-shadow:0 10px 30px rgba(0,0,0,.25);font-weight:700;transition:transform .3s ease;z-index:9999;max-width:90vw;text-align:center}
#toast.show{transform:translate(-50%,0)}
button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
@media (max-width:360px){.svcs,.grid2{grid-template-columns:1fr}}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>

async function dbRequest(path, method = 'GET', body){
  const hasBody = body !== undefined;
  let token = '';
  try{ if(auth && auth.currentUser) token = await auth.currentUser.getIdToken(); }catch(e){}
  const q = token ? `?auth=${encodeURIComponent(token)}` : '';
  const res = await fetch(`${DB}/${path}.json${q}`, {
    method,
    headers: hasBody ? {'Content-Type':'application/json'} : undefined,
    body: hasBody ? JSON.stringify(body) : undefined
  });
  if(!res.ok) throw new Error('DB ' + res.status);
  return res.json();
}

/* ===== الموقع والمسافة ===== */
function getPos(){
  return new Promise((resolve, reject) => {
    if(!navigator.geolocation) return reject(new Error('no-geo'));
    navigator.geolocation.getCurrentPosition(
      p => resolve({lat: p.coords.latitude, lng: p.coords.longitude, acc: Math.round(p.coords.accuracy)}),
      reject, {enableHighAccuracy: true, timeout: 10000, maximumAge: 15000});
  });
}
/* قراءة دقيقة: تنتظر أفضل قراءة حتى دقة 30 م أو انتهاء المهلة */
function getPosPrecise(timeoutMs = 12000){
  return new Promise((resolve, reject) => {
    if(!navigator.geolocation) return reject(new Error('no-geo'));
    let id = null, timer = null, best = null;
    const cleanup = () => { if(id !== null) navigator.geolocation.clearWatch(id); clearTimeout(timer); };
    const finish = () => { cleanup(); best ? resolve(best) : reject(new Error('no-fix')); };
    id = navigator.geolocation.watchPosition(p => {
      const cur = {lat: p.coords.latitude, lng: p.coords.longitude, acc: Math.round(p.coords.accuracy)};
      if(!best || cur.acc < best.acc) best = cur;
      if(best.acc <= 30) finish();
    }, err => { if(!best){ cleanup(); reject(err); } },
    {enableHighAccuracy: true, maximumAge: 0, timeout: timeoutMs});
    timer = setTimeout(finish, timeoutMs);
  });
}
function distKm(a, b){
  const R = 6371, t = d => d * Math.PI / 180;
  const dLat = t(b.lat - a.lat), dLng = t(b.lng - a.lng);
  const x = Math.sin(dLat/2)**2 + Math.cos(t(a.lat)) * Math.cos(t(b.lat)) * Math.sin(dLng/2)**2;
  return 2 * R * Math.asin(Math.sqrt(x));
}
/* المسافة بالمتر إن كانت أقل من كيلومتر، وإلا بالكيلومتر */
function fmtDist(km){ return km < 1 ? Math.round(km * 1000) + ' م' : km.toFixed(1) + ' كم'; }

const navLink = r => {

/* ===== الخريطة: تفتح خريطة الهاتف نفسها ===== */
function drawMap(el, points){
  if(!el) return;
  const pts = points.filter(Boolean);
  if(!pts.length){ el.innerHTML = ''; return; }
  el.innerHTML = `
    <div class="mapbox">
      ${pts.map(p => `
        <div class="pt">
          <span class="pdot" style="background:${p.color}"></span>
          <span class="pl">${esc(p.label)}</span>
          <a class="mlink" target="_blank" rel="noopener" href="${mapsUrl(p.lat, p.lng)}">افتح في الخريطة</a>
        </div>`).join('')}
      ${pts.length === 2 ? `<div class="dist">📏 المسافة بينكما: ${fmtDist(distKm(pts[0], pts[1]))}</div>` : ''}
    </div>`;
}

/* ===== الدردشة ===== */
function chatCardHTML(){
  return `
    <div class="card" id="chatCard">

        <button class="send" type="submit">إرسال</button>
      </form>
    </div>`;
}
function bindChatForm(){
  const f = document.getElementById('chatForm');
  if(!f) return;
  f.onsubmit = async e => {
    e.preventDefault();
    const inp = document.getElementById('chatIn');
    const text = inp.value.trim();
    if(!text || !chatRideId) return;
    inp.value = '';
    try{
      await dbRequest('rides/' + chatRideId + '/messages', 'POST', {from: chatRole, text, t: Date.now()});
    }catch(err){
      toast('تعذّر إرسال الرسالة');
      inp.value = text;
    }
  };
}
function renderChat(ride){
  const box = document.getElementById('chatMsgs');
  if(!box) return;
  const msgs = ride.messages ? Object.values(ride.messages).sort((a, b) => (a.t || 0) - (b.t || 0)) : [];
  if(msgs.length === chatMsgCount) return;
  if(chatMsgCount >= 0 && msgs.length > chatMsgCount){
    const last = msgs[msgs.length - 1];
    if(last.from !== chatRole){ toast('💬 رسالة جديدة'); buzz(); }
  }
  box.innerHTML = msgs.length
    ? msgs.slice(-80).map(m => `<div class="bubble ${m.from === chatRole ? 'me' : 'them'}">${esc(m.text)}</div>`).join('')
    : '<div class="muted" style="text-align:center;padding:10px">ابدأ المحادثة 👋</div>';
  box.scrollTop = box.scrollHeight;
  chatMsgCount = msgs.length;
}

/* ===== حفظ المستخدم بعد أي تسجيل دخول ===== */
async function storeUser(uid, base){
  const existing = await dbRequest('users/' + uid).catch(() => null);
  const merged = {
    ...(existing || {}),
    ...base,
    uid,
    name: base.name || (existing && existing.name) || 'مستخدم',
    createdAt: (existing && existing.createdAt) || base.createdAt || Date.now()
  };
  await dbRequest('users/' + uid, 'PUT', merged);
  setProfile({
    uid, name: merged.name, email: merged.email || '',
    phone: merged.phone || null, gender: merged.gender || null, role: merged.role || null,
    city: merged.city, vehicle: merged.vehicle, seats: merged.seats, car: merged.car
  });
}
async function saveGoogleUser(u){
  await storeUser(u.uid, {name: u.displayName || null, email: u.email || '', createdAt: Date.now()});
}
async function handleRedirect(){
  if(!auth) return;
  try{
    const res = await auth.getRedirectResult();
    if(res && res.user) await saveGoogleUser(res.user);
  }catch(e){
    toast('تعذّر تسجيل الدخول، حاول مرة أخرى');
  }
}
function logout(){
  stopAll();
  try{ if(auth) auth.signOut(); }catch(e){}
  try{ localStorage.removeItem('profile'); localStorage.removeItem('activeRide'); }catch(e){}
  location.hash = '#/start';
  route();
}

    'auth/wrong-password': 'الرقم أو كلمة المرور غير صحيحة',

    'auth/too-many-requests': 'محاولات كثيرة، انتظر قليلًا ثم حاول مرة أخرى',

function renderRide(rideId, ride){
  const st = ride.status || 'searching';
  const accepted = ACTIVE_STATES.includes(st);
  const finished = st === 'cancelled' || st === 'done';
  if(finished) saveRideId('');

  const me = ride.passengerLoc || ride.pickup;
  const dist = accepted && ride.driverLoc && me ? distKm(me, ride.driverLoc) : null;
  const etaMin = dist !== null ? Math.max(1, Math.round(dist / 25 * 60)) : null;

  document.getElementById('rideHead').innerHTML = `
    <div class="row" style="justify-content:space-between;flex-wrap:wrap">
      <span class="status ${esc(st)}">${STATUS_TXT[st] || esc(st)}</span>
      <b class="oprice" style="margin:0">${esc(ride.price)} ${CURRENCY}</b>
    </div>
    <div class="route" style="margin-top:12px">
      <div><span class="dot"></span>${esc(ride.from)}</div>
      <div><span class="dot end"></span>${esc(ride.to)}</div>
    </div>
    ${dist !== null ? `<div class="muted" style="margin-top:8px">المسافة بينك وبين السائق: ${fmtDist(dist)}</div><span class="eta">⏱ يصل خلال ~${etaMin} دقيقة</span>` : ''}`;

  drawMap(document.getElementById('map'), [
    me ? {lat: me.lat, lng: me.lng, label: 'أنت', color: '#2563eb'} : null,
    accepted && ride.driverLoc ? {lat: ride.driverLoc.lat, lng: ride.driverLoc.lng, label: ride.driverName || 'السائق', color: '#0f9d58'} : null
  ]);

  const offersEl = document.getElementById('offers');
  const actionsEl = document.getElementById('actions');
  const titleEl = document.getElementById('offersTitle');
  const errEl = document.getElementById('err');
  const chatArea = document.getElementById('chatArea');

  if(accepted){
    titleEl.textContent = 'السائق في الطريق إليك';
    offersEl.innerHTML = `
      <div class="offer" style="border:none;padding:6px 0">
        <div>
          <div class="name">${genderIcon(ride.driverGender)} ${esc(ride.driverName || 'السائق')}</div>
          <div class="meta">${svcIcon(ride.vehicle)} ${esc(ride.car || '')} · 🪑 ${esc(ride.seats || '-')} مقاعد · ${esc(ride.driverPhone || '')}</div>
        </div>
        <div class="oprice">${esc(ride.finalPrice)} ${CURRENCY}</div>
      </div>`;
    actionsEl.innerHTML = `<button class="btn ghost" id="shareTrip">📤 شارك موقعي مع شخص آخر</button>`;
    document.getElementById('shareTrip').onclick = () => {
      const spot = ride.passengerLoc || ride.pickup;
      const url = spot ? mapsUrl(spot.lat, spot.lng) : location.href;
      const text = `رحلتي مع ${ride.driverName || 'السائق'} إلى ${ride.to}`;
      if(navigator.share){ navigator.share({title: 'رحلة', text, url}).catch(() => {}); }
      else { try{ navigator.clipboard.writeText(url); toast('تم نسخ الرابط'); }catch(e){ toast(url); } }
    };
    if(!document.getElementById('chatCard')){ chatArea.innerHTML = chatCardHTML(); bindChatForm(); }
    renderChat(ride);
  }else if(finished){
    titleEl.textContent = '';
    offersEl.innerHTML = '';
    chatArea.innerHTML = '';
    const rated = (() => { try{ return localStorage.getItem('rated_' + rideId); }catch(e){ return null; } })();
    actionsEl.innerHTML = (st === 'done' && !rated && ride.driverPhone)
      ? `<div class="card" style="margin:0 0 10px;text-align:center"><b>كيف كانت الرحلة مع ${esc(ride.driverName || 'السائق')}؟</b>
           <div class="row" style="justify-content:center;margin-top:8px">${[1,2,3,4,5].map(n => `<button class="link star" data-st="${n}" style="font-size:1.8rem;text-decoration:none">⭐</button>`).join('')}</div>
         </div>`
      : '';
    actionsEl.innerHTML += `<a class="btn" href="#/">طلب رحلة جديدة</a>`;
    actionsEl.querySelectorAll('.star').forEach(b => b.onclick = async () => {
      try{

        try{ localStorage.setItem('rated_' + rideId, '1'); }catch(e){}

        actionsEl.querySelectorAll('.card').forEach(c => c.remove());

      </div>`).join('') : `<div class="empty">لا توجد عروض بعد <span class="pulse"></span></div>`;

    actionsEl.innerHTML = `<button class="btn danger" id="cancel">إلغاء الطلب</button>`;

    offersEl.querySelectorAll('button[data-oid]').forEach(b => {
      b.onclick = async () => {
        b.disabled = true;

          await dbRequest('rides/' + rideId, 'PATCH', {
            status: 'accepted', driverName: b.dataset.name, driverPhone: b.dataset.phone,

      };
    });
    document.getElementById('cancel').onclick = async () => {
      try{ await dbRequest('rides/' + rideId, 'PATCH', {status: 'cancelled'}); }catch(e){}
    };
  }
}

/* ===== السائق ===== */
function showDriver(){
  stopAll();
  const p = getProfile() || {};
  app.innerHTML = `
    <div class="card">
      <div class="row" style="justify-content:space-between;flex-wrap:wrap">
        <div>
          <h2 style="margin:0">مرحبًا ${esc(p.name || '')} ${genderIcon(p.gender)}</h2>
          <div class="muted" id="drvCity">المدينة: ${esc(p.city || 'جارٍ التحديد…')}</div>
        </div>
        <div class="row"><button class="link" id="toggleOnline"></button><button class="link" id="changeRole">تغيير الدور</button></div>
      </div>
      <div class="grid2">
        <div>
          <label for="drvCitySel">مدينتك</label>
          <select class="sel" id="drvCitySel">${cityOptions(p.city)}</select>
        </div>
        <div>
          <label for="vehSel">المركبة</label>
          <select class="sel" id="vehSel">${SERVICES.map(s => `<option ${s.id === (p.vehicle || 'سيارة') ? 'selected' : ''}>${esc(s.id)}</option>`).join('')}</select>
        </div>
        <div>
          <label for="seats">عدد المقاعد</label>
          <input id="seats" type="number" min="1" max="8" value="${esc(p.seats || 4)}">
        </div>
        <div>
          <label for="carName">الموديل</label>
          <input id="carName" placeholder="مثال: Dacia Logan" value="${esc(p.car || '')}">
        </div>
      </div>
    </div>
    <div id="active" data-rid=""></div>
    <div class="card" id="listCard">
      <div class="row" style="justify-content:space-between;flex-wrap:wrap">
        <span class="muted" id="radiusInfo"></span>
        <button class="link" id="toggleAll">عرض كل طلبات المدينة</button>
      </div>
      <div id="mapInfo"></div>
      <div id="driverList"></div>
      <div class="err" id="err"></div>
    </div>`;

  document.getElementById('drvCitySel').onchange = e => {
    saveProfileField('city', e.target.value);
    document.getElementById('drvCity').textContent = 'المدينة: ' + e.target.value;
    tick();
  };
  document.getElementById('vehSel').onchange = e => { saveProfileField('vehicle', e.target.value); tick(); };
  document.getElementById('seats').onchange = e => {
    const n = Math.min(8, Math.max(1, parseInt(e.target.value, 10) || 4));
    e.target.value = n; saveProfileField('seats', n);
  };
  document.getElementById('carName').onchange = e => saveProfileField('car', e.target.value.trim());

  const paintOnline = () => {
    const on = !!(getProfile() || {}).online;
    const b = document.getElementById('toggleOnline');
    b.textContent = on ? '🟢 متصل' : '⚪ غير متصل';
    b.style.color = on ? 'var(--ok)' : 'var(--muted)';
  };
  document.getElementById('toggleOnline').onclick = () => {
    const pr = getProfile() || {}; pr.online = !pr.online; setProfile(pr);
    paintOnline(); tick();
  };
  paintOnline();

  document.getElementById('toggleAll').onclick = () => {
    showAllCity = !showAllCity;
    document.getElementById('toggleAll').textContent = showAllCity ? 'عرض الطلبات القريبة فقط' : 'عرض كل طلبات المدينة';
    tick();
  };
  document.getElementById('changeRole').onclick = async () => {
    stopAll();
    try{ await dbRequest('users/' + p.uid + '/role', 'PUT', null); }catch(e){}
    saveProfileField('role', null);
    location.hash = '#/role';
  };

  const tick = async () => {
    if(!document.getElementById('active')) return;
    const me = getProfile() || {};
    const activeEl = document.getElementById('active');
    const listCard = document.getElementById('listCard');
    const listEl = document.getElementById('driverList');
    const mapInfo = document.getElementById('mapInfo');
    const errEl = document.getElementById('err');
    try{
      try{ lastDriverPos = await getPos(); }catch(e){}
      if(!document.getElementById('active')) return;

      const rides = (await dbRequest('rides')) || {};
      const entries = Object.entries(rides).filter(([, r]) => r);
      const mine = entries.find(([, r]) => ACTIVE_STATES.includes(r.status) && r.driverPhone === me.phone);

      if(mine){
        const [rid, r] = mine;
        listCard.style.display = 'none';
        if(driverNotifiedRide !== rid){ driverNotifiedRide = rid; toast('✅ الراكب قبل عرضك، توجّه إليه'); buzz(); }
        if(activeEl.dataset.rid !== rid){
          activeEl.dataset.rid = rid;
          activeEl.innerHTML = `<div class="card" id="activeInfo"></div>${chatCardHTML()}`;
          bindChatForm();
          chatMsgCount = -1;
        }
        chatRideId = rid; chatRole = 'driver';

        const pax = r.passengerLoc || r.pickup;
        const paxDist = lastDriverPos && pax ? fmtDist(distKm(lastDriverPos, pax)) : '';
        document.getElementById('activeInfo').innerHTML = `
          <div class="row" style="justify-content:space-between;flex-wrap:wrap">
            <span class="status accepted">${STATUS_TXT[r.status] || 'رحلة جارية'}</span>
            <b class="oprice" style="margin:0">${esc(r.finalPrice)} ${CURRENCY}</b>
          </div>
          <div class="route" style="margin-top:12px">
            <div><span class="dot"></span>الراكب: ${genderIcon(r.passengerGender)} ${esc(r.passengerName || '')} ${esc(r.passengerPhone || '')}</div>
            <div><span class="dot end"></span>${esc(r.to)}</div>
          </div>
          ${paxDist ? `<div class="muted" style="margin-top:8px">الراكب يبعد عنك ${paxDist}</div>` : ''}
          <div class="row" style="margin-top:6px">
            <a class="btn" style="margin-top:0" target="_blank" rel="noopener" href="${navLink(r)}">فتح الملاحة</a>
            <button class="btn ghost" id="nextState" style="margin-top:0">${NEXT[r.status] ? NEXT[r.status].label : 'إنهاء الرحلة'}</button>
          </div>`;
        document.getElementById('nextState').onclick = async () => {
          const nx = NEXT[r.status];
          if(!nx) return;
          try{ await dbRequest('rides/' + rid, 'PATCH', {status: nx.to}); }
          catch(e){ toast('تعذّر تحديث الحالة'); }
        };
        renderChat(r);

        if(lastDriverPos && Date.now() - lastLocPush >= LOC_MS){
          lastLocPush = Date.now();
          dbRequest('rides/' + rid + '/driverLoc', 'PUT', {...lastDriverPos, t: Date.now()}).catch(()=>{});
        }
        drawMap(document.getElementById('map'), [
          lastDriverPos ? {...lastDriverPos, label: 'موقعك', color: '#0f9d58'} : null,
          pax ? {lat: pax.lat, lng: pax.lng, label: 'الراكب', color: '#2563eb'} : null
        ]);
        return;
      }

      // لا توجد رحلة جارية: عرض الطلبات مرتبة حسب القرب
      activeEl.innerHTML = '';
      activeEl.dataset.rid = '';
      chatRideId = null;
      listCard.style.display = '';

      const vehicle = me.vehicle || 'سيارة';
      const open = entries.filter(([, r]) => r.status === 'searching' && r.city === me.city && (r.service || 'سيارة') === vehicle);
      const distOf = ([, r]) => (lastDriverPos && r.pickup) ? distKm(lastDriverPos, r.pickup) : Infinity;
      const near = (me.online ? open : [])
        .filter(item => showAllCity || !lastDriverPos || distOf(item) <= PICKUP_RADIUS_KM)
        .sort((a, b) => distOf(a) - distOf(b));

      document.getElementById('radiusInfo').textContent = !me.online
        ? 'أنت غير متصل، فعّل الاتصال لرؤية الطلبات'
        : (!lastDriverPos
          ? 'فعّل الموقع لنحسب المسافة بينك وبين كل طلب'
          : (showAllCity ? `كل طلبات ${me.city || 'مدينتك'} (${near.length})` : `الطلبات ضمن ${PICKUP_RADIUS_KM} كم منك (${near.length})`));

      if(!me.online){
        listEl.innerHTML = `<div class="empty">غير متصل الآن</div>`;
      }else if(!near.length){
        listEl.innerHTML = `<div class="empty">لا توجد طلبات ${showAllCity ? 'في مدينتك' : 'قريبة منك'} الآن <span class="pulse"></span></div>`;
      }else{
        listEl.innerHTML = near.map(item => {
          const [id, r] = item;
          const sent = r.offers && Object.values(r.offers).some(o => o.driverPhone === me.phone);
          const d = distOf(item);
          const distTxt = d === Infinity ? 'المسافة غير معروفة' : fmtDist(d);
          const badge = d <= PICKUP_RADIUS_KM ? 'badge near' : 'badge';
          return `
            <div class="reqitem">
              <div class="reqtop">
                <div>
                  <div class="name" style="font-weight:800">${genderIcon(r.passengerGender)} ${svcIcon(r.service)} ${esc(r.from)} → ${esc(r.to)}</div>
                  <div class="muted">${esc(r.price)} ${CURRENCY} مقترح</div>
                </div>
                <span class="${badge}">📍 ${distTxt}${r.pickupApprox ? ' · تقريبي' : ''}</span>
              </div>
              ${sent
                ? `<div class="status accepted" style="align-self:flex-start">تم إرسال عرضك ✓</div>`
                : `<div class="row">
                     <input type="number" min="${MIN_PRICE}" max="${MAX_PRICE}" step="${STEP}" value="${esc(r.price)}" data-ride="${esc(id)}" style="flex:1">
                     <button class="send" data-send="${esc(id)}">أرسل عرضًا</button>
                   </div>`}
            </div>`;
        }).join('');

        listEl.querySelectorAll('button[data-send]').forEach(b => {
          b.onclick = async () => {
            const rid = b.dataset.send;
            const price = Number(listEl.querySelector(`input[data-ride="${rid}"]`).value);
            if(!price || price < MIN_PRICE || price > MAX_PRICE){ errEl.textContent = 'السعر غير صالح'; return; }
            b.disabled = true; errEl.textContent = '';
            try{
              await dbRequest('rides/' + rid + '/offers', 'POST', {
                driverName: me.name, driverPhone: me.phone, driverGender: me.gender || '',
                car: me.car || '', seats: me.seats || 4, vehicle,
                rating: 5, price, createdAt: Date.now()
              });
              tick();
            }catch(e){
              errEl.textContent = 'تعذّر إرسال العرض، حاول مرة أخرى';
              b.disabled = false;
            }
          };
        });
      }

      if(lastOpenCount >= 0 && near.length > lastOpenCount){ toast('🚨 طلب جديد في مدينتك'); buzz(); }
      lastOpenCount = near.length;

      // الخريطة: موقعك وأقرب 5 طلبات
      const nearest = near.slice(0, 5).map(([, r]) => r.pickup ? {lat: r.pickup.lat, lng: r.pickup.lng, label: r.from || 'طلب', color: '#ff6a13'} : null);
      mapInfo.innerHTML = '<div id="map"></div>';
      drawMap(document.getElementById('map'), [lastDriverPos ? {...lastDriverPos, label: 'موقعك', color: '#0f9d58'} : null, ...nearest]);
    }catch(e){
      const el = document.getElementById('err');
      if(el) el.textContent = 'تعذّر تحميل الطلبات، جارٍ إعادة المحاولة…';
    }
  };

  if(!p.city){
    getPos().then(pos => {
      const c = nearestCity(pos);
      saveProfileField('city', c.name);
      document.getElementById('drvCitySel').value = c.name;
      document.getElementById('drvCity').textContent = 'المدينة: ' + c.name;
      tick();
    }).catch(() => {
      document.getElementById('drvCity').textContent = 'اختر مدينتك من القائمة';
    });
  }

  tick();
  pollTimer = setInterval(tick, POLL_MS);
}

/* ===== التوجيه ===== */
function route(){
  const h = location.hash.replace(/^#/, '');
  const p = getProfile();
  window.scrollTo(0, 0);
  document.getElementById('logoutBtn').style.display = p ? '' : 'none';

  if(!p || !p.uid || h === '/start'){ showOnboarding(); return; }
  if(!p.phone || !p.gender){ showComplete(); return; }
  if(!p.role || h === '/role'){ showRole(); return; }
  if(p.role === 'driver'){ showDriver(); return; }

  const m = h.match(/^\/ride\/([\w-]+)$/);
  if(m){ saveRideId(m[1]); showRide(m[1]); return; }

  const active = savedRideId();
  if(active && !h){ location.hash = '#/ride/' + active; return; }
  showRequest();
}

document.getElementById('logoutBtn').onclick = logout;
window.addEventListener('hashchange', route);
(async () => {
  await handleRedirect();
  route();
})();
</script>
</body>
